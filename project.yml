name: Inkwell
options:
  bundleIdPrefix: com.inkwell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.6.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic

targets:
  Inkwell:
    type: application
    platform: iOS
    # 注意：Assets.xcassets 必须走 sources，XcodeGen 才会识别成 asset catalog
    # 交给 actool 编译出 Assets.car；如果放到 resources: 里只会被当普通文件夹复制。
    sources:
      - path: Inkwell
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inkwell.reader
        PRODUCT_NAME: Inkwell
        MARKETING_VERSION: "1.0.5"
        CURRENT_PROJECT_VERSION: "6"
        INFOPLIST_FILE: Inkwell/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SwiftSoup
      - package: GRDB
        product: GRDB
      - package: ZIPFoundation
      - sdk: JavaScriptCore.framework
      - sdk: PDFKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: CoreImage.framework
      - sdk: WebKit.framework
